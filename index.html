<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slend Help Center</title>
<style>
  :root {
    --bg: #f5f8fa;
    --panel: #ffffff;
    --border: #e2e8ee;
    --text: #16202b;
    --muted: #64748b;
    --ink: #0b0f14;
    --aqua: #48f0f0;
    --cyan: #30c0f0;
    --blue: #6090d8;
    --accent: #1487a8;
    --accent-soft: #e3f6f8;
    --radius: 0.75rem;
    --pink: #ff7eb6;
    --orange: #ff9a76;
    --purple: #7a6fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: linear-gradient(90deg, var(--pink), var(--orange) 35%, var(--purple) 70%, var(--blue)); padding: 28px 20px; color: white; box-shadow: 0 6px 20px rgba(18, 24, 30, 0.12); }
  .header-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); padding: 10px 14px; border-radius: 12px; }
  header img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: rgba(0,0,0,0.12); padding: 6px; }
  header h1 { font-size: 20px; margin: 0; color: #fff; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 12.5px; color: rgba(255,255,255,0.9); }
  .shell { max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; user-select: none; }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--cyan); }
  .search { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; margin-bottom: 16px; outline: none; background: var(--panel); }
  .search:focus { border-color: var(--cyan); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: border-color 0.15s; }
  .item:hover { border-color: var(--cyan); }
  .item-title { font-size: 15px; font-weight: 600; }
  .detail { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .detail-title { font-size: 19px; font-weight: 700; margin: 0; }
  .detail-body { font-size: 14.5px; line-height: 1.65; color: #364152; }
  .back { display: inline-block; margin-bottom: 14px; font-size: 13px; color: var(--accent); cursor: pointer; font-weight: 600; }
  .share-btn { border: 1px solid var(--border); background: #f8fbfc; color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .share-btn:hover { border-color: var(--cyan); background: #eefafc; }
  .kw-link { color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; text-decoration: none; font-weight: 600; cursor: pointer; }
  .kw-link:hover { background: #cdeef3; }
  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }
  .error { background: #fff4f4; border: 1px solid #f0c9c9; color: #9a3232; font-size: 13px; padding: 14px 16px; border-radius: var(--radius); line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23ffffff' fill-opacity='.16'/%3E%3Cpath d='M10 12h20v3H10zm0 7h20v3H10zm0 7h13v3H10z' fill='white'/%3E%3C/svg%3E" alt="Slend">
    <div>
      <h1>Help Center</h1>
      <p>Answers for everything inside Slend</p>
    </div>
  </div>
</header>

<div class="shell">
  <div class="tabs">
    <div class="tab active" data-tab="pages">Pages</div>
    <div class="tab" data-tab="keywords">Keywords</div>
  </div>
  <div id="search-wrap"></div>
  <div id="content">Loading…</div>
</div>

<script>
let DATA = { pages: [], keywords: [] };
let activeTab = "pages";
let detailItem = null;
let searchQuery = "";

const contentEl = document.getElementById("content");
const searchWrap = document.getElementById("search-wrap");
const tabs = document.querySelectorAll(".tab");

function routeForState() {
  if (detailItem) return `#/${detailItem.type}/${encodeURIComponent(detailItem.id)}`;
  if (activeTab === "keywords" && searchQuery) return `#/search?q=${encodeURIComponent(searchQuery)}`;
  return `#/${activeTab}`;
}

function getShareUrl() {
  const url = new URL(location.href);
  url.hash = routeForState();
  return url.toString();
}

function navigate() {
  const next = routeForState();
  if (location.hash !== next) history.pushState(null, "", next);
  render();
}

function syncRouteFromLocation() {
  const hash = location.hash.slice(1);
  const [path, queryString = ""] = hash.split("?");
  const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
  const params = new URLSearchParams(queryString);
  detailItem = null;
  searchQuery = "";

  if (parts[0] === "page" && parts[1]) {
    activeTab = "pages";
    detailItem = { type: "page", id: parts[1] };
  } else if (parts[0] === "keyword" && parts[1]) {
    activeTab = "keywords";
    detailItem = { type: "keyword", id: parts[1] };
  } else if (parts[0] === "search") {
    activeTab = "keywords";
    searchQuery = params.get("q") || "";
  } else {
    activeTab = parts[0] === "keywords" ? "keywords" : "pages";
  }
  updateActiveTab();
  render();
}

function updateActiveTab() {
  tabs.forEach(tab => tab.classList.toggle("active", tab.dataset.tab === activeTab));
}

tabs.forEach(tab => tab.addEventListener("click", () => {
  activeTab = tab.dataset.tab;
  detailItem = null;
  searchQuery = "";
  updateActiveTab();
  navigate();
}));

window.addEventListener("hashchange", syncRouteFromLocation);
window.addEventListener("popstate", syncRouteFromLocation);

fetch("./help-content.json")
  .then(response => {
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.json();
  })
  .then(data => {
    DATA = data;
    syncRouteFromLocation();
  })
  .catch(error => {
    contentEl.innerHTML = `<div class="error">
      Couldn't load help-content.json (${error.message}).<br><br>
      Make sure help-content.json sits in the <b>same folder</b> as this page. If you're opening this file
      directly by double-clicking it, some browsers block loading a separate JSON file for security reasons —
      it will work correctly once this is hosted on GitHub Pages, Vercel, or a similar site. In Firefox, opening
      the file directly usually works fine too.
    </div>`;
  });

function keywordLookup() {
  return [...DATA.keywords].sort((a, b) => b.term.length - a.term.length);
}

function autoLink(text, currentId) {
  const keywords = keywordLookup();
  let result = text;
  keywords.forEach(keyword => {
    if (keyword.id === currentId) return;
    const expression = new RegExp("\\b(" + keyword.term.replace(/[.*+?^${}()|[\\]\\]/g, "\\$&") + ")\\b", "g");
    result = result.replace(expression, `<a href="#/keyword/${encodeURIComponent(keyword.id)}" class="kw-link" data-kwid="${keyword.id}">$1</a>`);
  });
  return result;
}

function render() {
  updateActiveTab();
  if (detailItem) {
    searchWrap.innerHTML = "";
    renderDetail();
    return;
  }

  if (activeTab === "keywords") {
    searchWrap.innerHTML = `<input class="search" placeholder="Search keywords..." id="search-input" aria-label="Search keywords">`;
    const input = document.getElementById("search-input");
    input.value = searchQuery;
    input.addEventListener("input", event => {
      searchQuery = event.target.value;
      const next = routeForState();
      if (location.hash !== next) history.replaceState(null, "", next);
      renderList();
    });
  } else {
    searchWrap.innerHTML = "";
  }
  renderList();
}

function renderList() {
  const items = activeTab === "pages" ? DATA.pages : DATA.keywords;
  const filtered = activeTab === "keywords" && searchQuery
    ? items.filter(keyword => keyword.term.toLowerCase().includes(searchQuery.toLowerCase()))
    : items;

  if (filtered.length === 0) {
    contentEl.innerHTML = `<div class="empty">No matches.</div>`;
    return;
  }

  contentEl.innerHTML = `<div class="list">` + filtered.map(item => `
    <div class="item" data-id="${item.id}">
      <div class="item-title">${activeTab === "pages" ? item.title : item.term}</div>
    </div>
  `).join("") + `</div>`;

  contentEl.querySelectorAll(".item").forEach(element => {
    element.addEventListener("click", () => {
      detailItem = { type: activeTab === "pages" ? "page" : "keyword", id: element.dataset.id };
      navigate();
    });
  });
}

async function copyCurrentLink(button) {
  const shareUrl = getShareUrl();

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(shareUrl);
    } else {
      const temp = document.createElement("textarea");
      temp.value = shareUrl;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
    }

    button.textContent = "Copied!";
    setTimeout(() => { button.textContent = "Copy link"; }, 1200);
  } catch (error) {
    button.textContent = "Copy failed";
    setTimeout(() => { button.textContent = "Copy link"; }, 1200);
  }
}

function renderDetail() {
  const list = detailItem.type === "page" ? DATA.pages : DATA.keywords;
  const item = list.find(entry => entry.id === detailItem.id);
  if (!item) {
    detailItem = null;
    activeTab = "pages";
    navigate();
    return;
  }
  const title = detailItem.type === "page" ? item.title : item.term;
  const linkedBody = autoLink(item.description, detailItem.type === "keyword" ? item.id : null);

  contentEl.innerHTML = `
    <div class="back" id="back-btn">&larr; Back to ${detailItem.type === "page" ? "Pages" : "Keywords"}</div>
    <div class="detail">
      <div class="detail-header">
        <div class="detail-title">${title}</div>
        <button type="button" class="share-btn" id="share-btn">Copy link</button>
      </div>
      <div class="detail-body">${linkedBody}</div>
    </div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => {
    detailItem = null;
    searchQuery = "";
    navigate();
  });

  document.getElementById("share-btn").addEventListener("click", function () {
    copyCurrentLink(this);
  });

  contentEl.querySelectorAll(".kw-link").forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();
      activeTab = "keywords";
      detailItem = { type: "keyword", id: link.dataset.kwid };
      searchQuery = "";
      navigate();
    });
  });
}
</script>
</body>
</html>
